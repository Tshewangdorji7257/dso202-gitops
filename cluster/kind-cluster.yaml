# ---------------------------------------------------------------------------
# File:        cluster/kind-cluster.yaml
# Assignment:  DSO202 Assignment 4 - GitOps Delivery of the Task Tracker
# Descriptor:  1.2.5 (local cluster with kind), reused in 4.2.1
# Purpose:     The Practical 1 / Assignment 1 kind configuration, copied
#              unchanged except for the cluster name, which is now
#              "dso202-gitops" (section 6.1). One control plane, two workers.
#              NodePort 30080 (dev frontend) is published on the host as
#              http://localhost:30080. Staging (30081) is not mapped on
#              purpose and is reached with kubectl port-forward.
# Apply with:  kind create cluster --config cluster/kind-cluster.yaml
# Delete with: kind delete cluster --name dso202-gitops
# ---------------------------------------------------------------------------
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# Cluster name: Docker containers dso202-gitops-control-plane, -worker, -worker2,
# and kubectl context kind-dso202-gitops.
name: dso202-gitops
networking:
  # API server on the loopback interface only, not exposed to the network.
  apiServerAddress: "127.0.0.1"
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
nodes:
  # Node 1 of 3: control plane (kept tainted, so application Pods run on workers).
  # No "image:" line: as in Practical 1, kind uses its default node image
  # (Kubernetes v1.36.1 with the kind release used in Practical 1).
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          name: control-plane
    # A NodePort is opened on every node, so mapping it on one node is enough.
    # containerPort must equal frontend.service.nodePort in environments/dev/values.yaml.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        listenAddress: "127.0.0.1"
        protocol: TCP
  # Node 2 of 3: first worker.
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-node-1
          kubeletExtraArgs:
            node-labels: "dso202/node-role=worker,dso202/node-index=1"
  # Node 3 of 3: second worker.
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-node-2
          kubeletExtraArgs:
            node-labels: "dso202/node-role=worker,dso202/node-index=2"
