# ---------------------------------------------------------------------------
# File:        argocd/applications/platform-dev.yaml
# Assignment:  DSO202 Assignment 4 - GitOps Delivery of the Task Tracker
# Descriptor:  4.2.2 (Applications), 3.2 (namespace, quota, RBAC)
# Purpose:     Delivers the dev platform layer from platform/dev: namespace
#              dso202-dev, ResourceQuota and LimitRange, Role and RoleBinding,
#              and the database credentials as a SealedSecret.
#              Wave -1: after the Sealed Secrets controller (-2), before the
#              workloads (0) that read the namespace and the credentials.
#              Uses the platform project because the workload project may not
#              create Namespaces, quotas, Roles or SealedSecrets.
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/Tshewangdorji7257/dso202-gitops.git
    targetRevision: main
    path: platform/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dso202-dev
  syncPolicy:
    automated:
      prune: true              # Task 8 prune drill relies on this
      selfHeal: true
