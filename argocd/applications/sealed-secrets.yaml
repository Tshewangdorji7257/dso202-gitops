# ---------------------------------------------------------------------------
# File:        argocd/applications/sealed-secrets.yaml
# Assignment:  DSO202 Assignment 4 - GitOps Delivery of the Task Tracker
# Descriptor:  4.4.1 (secrets management with Sealed Secrets)
# Purpose:     Installs the Sealed Secrets controller from the Bitnami Helm
#              repository, chart 2.20.0 (controller 0.40.0). Wave -2: the
#              SealedSecret kind must exist before the platform Applications
#              (wave -1) create SealedSecret objects.
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.20.0          # pinned chart version (section 3.1)
    helm:
      releaseName: sealed-secrets
      valuesObject:
        # kubeseal looks for a controller named "sealed-secrets-controller"
        # by default; this override makes the names match.
        fullnameOverride: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true        # declared here, so still Git-described
      - ServerSideApply=true        # large CRD, same reason as bootstrap
