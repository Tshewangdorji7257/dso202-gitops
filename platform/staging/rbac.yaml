# ---------------------------------------------------------------------------
# File:        platform/staging/rbac.yaml
# Assignment:  DSO202 Assignment 4 - GitOps Delivery of the Task Tracker
# Descriptor:  3.2 (Kubernetes RBAC), reused in 4.2.2
# Purpose:     Same read-only Role and RoleBinding as dev, in dso202-staging.
# ---------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tasktracker-viewer
  namespace: dso202-staging
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, configmaps, persistentvolumeclaims, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tasktracker-viewer-binding
  namespace: dso202-staging
subjects:
  - kind: Group
    name: dso202:developers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: tasktracker-viewer
  apiGroup: rbac.authorization.k8s.io
