# ---------------------------------------------------------------------------
# File:        platform/staging/tasktracker-credentials.sealed.yaml
# Assignment:  DSO202 Assignment 4 - GitOps Delivery of the Task Tracker
# Descriptor:  4.4.1 (Sealed Secrets)
# Purpose:     Database credentials for dso202-staging, encrypted with kubeseal for this
#              cluster's sealing key (strict scope: this name and namespace).
#              The controller turns it into the Secret tasktracker-credentials.
# ---------------------------------------------------------------------------
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: tasktracker-credentials
  namespace: dso202-staging
spec:
  encryptedData:
    DB_PASSWORD: 
    DB_USER: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: tasktracker-credentials
      namespace: dso202-staging
