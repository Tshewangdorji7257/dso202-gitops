# ---------------------------------------------------------------------------
# File:        platform/dev/rbac.yaml
# Assignment:  DSO202 Assignment 4 - GitOps Delivery of the Task Tracker
# Descriptor:  3.2 (Kubernetes RBAC), reused in 4.2.2
# Purpose:     The Assignment 2 Role and RoleBinding: members of the group
#              "dso202:developers" may read the Task Tracker objects and Pod
#              logs in this namespace, but not change them. Changes go
#              through Git. Delivered by platform-dev, because the workload
#              project (dso202) is not allowed to create Roles.
# ---------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tasktracker-viewer
  namespace: dso202-dev
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, configmaps, persistentvolumeclaims, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tasktracker-viewer-binding
  namespace: dso202-dev
subjects:
  - kind: Group
    name: dso202:developers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: tasktracker-viewer
  apiGroup: rbac.authorization.k8s.io
