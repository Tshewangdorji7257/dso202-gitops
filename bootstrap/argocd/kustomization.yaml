# ---------------------------------------------------------------------------
# File:        bootstrap/argocd/kustomization.yaml
# Assignment:  DSO202 Assignment 4 - GitOps Delivery of the Task Tracker
# Descriptor:  4.2.1 (installing Argo CD), 4.1.2 (versioned desired state)
# Purpose:     Installs Argo CD v3.5.6 from the upstream manifest, pinned by
#              tag in the URL, and layers the local settings on top with two
#              strategic-merge patches. Apply with server-side apply, because
#              the ApplicationSet CRD is larger than the 262144-byte limit of
#              the last-applied-configuration annotation:
#                kubectl apply -k bootstrap/argocd --server-side --force-conflicts
# ---------------------------------------------------------------------------
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every namespaced object from the upstream manifest lands in "argocd".
namespace: argocd

resources:
  - namespace.yaml
  # Pinned to the exact release tag (section 3.1). Never "stable" or "master".
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml

patches:
  # Local settings: polling interval, Application health check, reviewer account.
  - path: argocd-cm-patch.yaml
  # Local RBAC: what the reviewer account may do.
  - path: argocd-rbac-cm-patch.yaml
