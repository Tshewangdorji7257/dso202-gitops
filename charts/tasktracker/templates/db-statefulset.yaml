# ---------------------------------------------------------------------------
# File:        charts/tasktracker/templates/db-statefulset.yaml
# Assignment:  DSO202 Assignment 4 - GitOps Delivery of the Task Tracker
# Descriptor:  2.1 (StatefulSets, persistent storage), 4.3.2 (sync waves)
# Purpose:     PostgreSQL with a 1Gi PVC. Wave 1: Argo CD waits until the
#              database is ready before it starts the backend (wave 2).
#              updateStrategy is RollingUpdate because Argo CD does not report
#              an OnDelete StatefulSet as Healthy (section 13).
#              Credentials are read from the Secret created by the
#              SealedSecret in platform/<env>/; the chart holds no password.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  labels:
    tier: database
    {{- include "tasktracker.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: db-svc
  replicas: {{ .Values.database.replicas }}
  selector:
    matchLabels:
      tier: database
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ ternary "Retain" "Delete" .Values.database.retainPvc }}
    whenScaled: {{ ternary "Retain" "Delete" .Values.database.retainPvc }}
  template:
    metadata:
      labels:
        tier: database
        {{- include "tasktracker.labels" . | nindent 8 }}
    spec:
      containers:
        - name: database
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: {name: app-config, key: POSTGRES_DB}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: {{ include "tasktracker.secretName" . }}, key: POSTGRES_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "tasktracker.secretName" . }}, key: POSTGRES_PASSWORD}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.database.storage.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.storage.size }}
