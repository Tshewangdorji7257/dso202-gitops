# ---------------------------------------------------------------------------
# File:        charts/tasktracker/templates/backend.yaml
# Assignment:  DSO202 Assignment 4 - GitOps Delivery of the Task Tracker
# Descriptor:  1.5.3 (Deployments, probes), 4.3.2 (sync waves)
# Purpose:     Backend API and its ClusterIP Service. Wave 2: after the
#              database is Healthy, before the frontend (wave 3).
#              progressDeadlineSeconds turns a crash-looping rollout into a
#              failed (Degraded) Deployment that Argo CD can report (Task 7).
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    tier: backend
    {{- include "tasktracker.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.backend.replicas }}
  progressDeadlineSeconds: {{ .Values.backend.progressDeadlineSeconds }}
  selector:
    matchLabels:
      tier: backend
  template:
    metadata:
      labels:
        tier: backend
        {{- include "tasktracker.labels" . | nindent 8 }}
      annotations:
        {{- include "tasktracker.configChecksum" . | nindent 8 }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          envFrom:
            - configMapRef: {name: app-config}
            - secretRef: {name: {{ include "tasktracker.secretName" . }}}
          readinessProbe:
            httpGet:
              path: /api/status
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  labels:
    tier: backend
    {{- include "tasktracker.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  selector:
    tier: backend
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
