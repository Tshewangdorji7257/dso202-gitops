# ---------------------------------------------------------------------------
# File:        charts/tasktracker/templates/frontend.yaml
# Assignment:  DSO202 Assignment 4 - GitOps Delivery of the Task Tracker
# Descriptor:  1.5.3 (Deployments), 1.2.5 (NodePort access), 4.3.2 (waves)
# Purpose:     Frontend and its NodePort Service. Wave 3 (last), after the
#              backend is Healthy. The NodePort comes from the environment
#              values: 30080 in dev (mapped by kind to localhost:30080) and
#              30081 in staging (reached with kubectl port-forward).
#              The Assignment 3 Ingress is not used in this assignment.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    tier: frontend
    {{- include "tasktracker.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: {{ .Values.frontend.replicas }}
  progressDeadlineSeconds: {{ .Values.frontend.progressDeadlineSeconds }}
  selector:
    matchLabels:
      tier: frontend
  template:
    metadata:
      labels:
        tier: frontend
        {{- include "tasktracker.labels" . | nindent 8 }}
      annotations:
        {{- include "tasktracker.configChecksum" . | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.port }}
          envFrom:
            - configMapRef: {name: app-config}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  labels:
    tier: frontend
    {{- include "tasktracker.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    tier: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
      {{- if eq .Values.frontend.service.type "NodePort" }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
